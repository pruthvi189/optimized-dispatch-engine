# Dispatch engine configuration (Phase 3). Merged into DEFAULT_CONFIG.
enabled: true
default_policy: immediate
predictor_dir: artifacts

# Which prep prediction drives dispatch timing. "low" = calibrated lower
# quantile (dispatch so the rider reaches the kitchen at the earliest
# high-confidence ready time, so food never waits on the rider); "mean" =
# the point forecast. The mean is always used for the reported ETA.
dispatch_quantile: low

# Dynamic risk buffer (minutes) by prediction uncertainty tier.
# PRD: Low 30s / Med 1min / High 2-3min.
risk_buffer_min:
  low: 0.5
  medium: 1.0
  high: 2.5

# Extra buffer (minutes) per order currently queued in the order's kitchen.
congestion_buffer_per_order: 0.3

# Cost score weights: 1x rider idle + 5x order wait + 10x late.
cost_weights:
  idle: 1
  wait: 5
  late: 10

# Customer promise: order delivered within this many minutes of placement.
# Bangalore-calibrated: mean delivery 26.3 min, P90=39 min; 40-min promise
# covers ~92% of normal-condition deliveries.
promised_delivery_min: 40.0

# Rider hub-to-kitchen distance sampled per order (km).
hub_distance_range_km: [0.5, 2.0]

# Fixed time for pickup handoff at the kitchen (minutes).
pickup_time_min: 0.5

# Rider unavailable penalty after a rider cancel (minutes), then back to idle.
penalty_min: 10.0

# Bangalore-calibrated weather speed factors for customer leg travel.
# Stormy/Sandstorms/Windy: +17-18%, Cloudy/Fog: +27-29%.
weather_speed_factor:
  clear: 1.0
  rain: 1.18
  storm: 1.30
# Travel time multipliers by severity. Calibrated to Bangalore real delivery
# data: Low=21.7min baseline, Medium=26.6min (+23%), Jam=30.9min (+42%).
traffic_speed_factor:
  low: 1.0
  moderate: 1.23
  heavy: 1.42

# Kitchen selection policy (Phase 9).
# Weights for the candidate ranking score (lower is better):
#   score = w_distance * distance_km + w_queue * queue_len + w_staff * (1/staff)
# These are exposed for transparency; do NOT tune after seeing experiment results.
kitchen_selection:
  weight_distance: 1.0
  weight_queue: 1.5
  weight_staff: 1.0
  avg_prep_min: 7.0
  kitchen_locations:
    - [-5.1, 5.1]    # Kitchen 1 — northwest
    - [5.1, -3.7]    # Kitchen 2 — southeast
    - [-1.5, -6.6]   # Kitchen 3 — south-center
    - [5.1, 5.1]     # Kitchen 4 — northeast

# Joint kitchen + rider optimization (Phase 10).
# avg_prep_min is shared with kitchen_selection above.
# No tunable weights — the optimizer minimizes total delivery time directly.
